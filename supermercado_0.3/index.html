<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado La Granja</title>
    <!-- hoja de estilos de la pagina -->
    <link rel="stylesheet" href="css/index.css">
</head>
<!-- cuerpo de la pagina -->
<body class="pagina">

    <!-- ========== encabezado ========== -->
    <header class="encabezado">
        <h2 class="encabezado__titulo">Supermercado La Granja</h2>
    </header>

    <!-- ========== contenido principal ========== -->
    <main class="contenedor">

        <!-- tarjeta del login -->
        <section class="tarjeta">

            <!-- formulario de ingreso -->
            <form class="formulario" action="usuario.php" method="POST">

                <!-- cargo -->
                <div class="campo">
                    <label class="campo__etiqueta" for="cargo">Cargo:</label>
                    <select class="campo__select" id="cargo" name="cargo" required><!-- lista desplegable-->
                        <option value="">seleccione</option>
                        <option value="1">Administrador</option>
                        <option value="2">Empleado</option>
                    </select>
                </div>

                <!-- usuario -->
                <div class="campo">
                    <label class="campo__etiqueta" for="usuario">Usuario:</label>
                    <input class="campo__input" type="text" id="usuario" name="usuario" required><!-- cajas de texto -->
                </div>

                <!-- contrasena -->
                <div class="campo">
                    <label class="campo__etiqueta" for="contra">Contraseña:</label>
                    <input class="campo__input" type="password" id="contra" name="contra" required>
                </div>

                <!-- boton ingresar -->
                <button class="boton boton--principal" type="submit" name="ingresar">Ingresar</button>

            </form>

            <!-- formulario de registro -->
            <form class="formulario formulario--registro" action="registro.php">
                <button class="boton boton--secundario">Registrarse</button>
            </form>

        </section>

    </main>

</body>
</html>
